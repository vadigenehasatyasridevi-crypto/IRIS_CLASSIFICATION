<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Iris Flower Classification </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="container">

        <h1>🌺 🌿 Iris Flower Classification 🌿 🌺</h1>

        <p class="description">
            Enter the measurements of an Iris flower
            to predict its species.
        </p>

        <form id="predictionForm">

            <div class="form-group">
                <label>Sepal Length (cm)</label>
                <input
                    type="number"
                    step="0.1"
                    id="sepal_length"
                    value="5.1"
                    required
                >
            </div>

            <div class="form-group">
                <label>Sepal Width (cm)</label>
                <input
                    type="number"
                    step="0.1"
                    id="sepal_width"
                    value="3.5"
                    required
                >
            </div>

            <div class="form-group">
                <label>Petal Length (cm)</label>
                <input
                    type="number"
                    step="0.1"
                    id="petal_length"
                    value="1.4"
                    required
                >
            </div>

            <div class="form-group">
                <label>Petal Width (cm)</label>
                <input
                    type="number"
                    step="0.1"
                    id="petal_width"
                    value="0.2"
                    required
                >
            </div>

            <button type="submit">
                Predict Iris Species
            </button>

        </form>

        <div id="result" class="result"></div>

        <div class="examples">

            <h3>Example Values</h3>

            <p>
                <strong>Setosa:</strong>
                5.1, 3.5, 1.4, 0.2
            </p>

            <p>
                <strong>Versicolor:</strong>
                6.0, 2.9, 4.5, 1.5
            </p>

            <p>
                <strong>Virginica:</strong>
                6.5, 3.0, 5.2, 2.0
            </p>

        </div>

    </div>


    <script>

        document
            .getElementById("predictionForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const data = {

                    sepal_length:
                        parseFloat(
                            document.getElementById("sepal_length").value
                        ),

                    sepal_width:
                        parseFloat(
                            document.getElementById("sepal_width").value
                        ),

                    petal_length:
                        parseFloat(
                            document.getElementById("petal_length").value
                        ),

                    petal_width:
                        parseFloat(
                            document.getElementById("petal_width").value
                        )
                };


                const response = await fetch("/predict", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(data)

                });


                const result = await response.json();

                const resultElement =
                    document.getElementById("result");


                if (response.ok) {

                    resultElement.innerHTML =
                        "🌸 Prediction: <strong>"
                        + result.prediction
                        + "</strong>";

                } else {

                    resultElement.innerHTML =
                        "❌ " + result.error;

                }

            });

    </script>

</body>

</html>
